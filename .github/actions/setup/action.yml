name: Set up the workspace
description: >-
  pnpm and Node (with pnpm's store cached), the FontAwesome registry's token, and a frozen install —
  what every CI job needs before it runs anything. The job checks the repo out first: this action
  lives in it.

inputs:
  fontawesome-token:
    description: The FONTAWESOME_NPM_AUTH_TOKEN repo secret (a composite action cannot read secrets).
    required: true

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm

    # The `@fortawesome` scope resolves from FontAwesome's private registry (see
    # `.npmrc`), so the install — not just the Pro packages — needs the token.
    # Append it to the runner's `~/.npmrc`, not the committed file. Repo secret:
    # FONTAWESOME_NPM_AUTH_TOKEN. Note that fork PRs cannot read repo secrets.
    - name: Authenticate to the FontAwesome registry
      shell: bash
      env:
        FONTAWESOME_NPM_AUTH_TOKEN: ${{ inputs.fontawesome-token }}
      run: echo "//npm.fontawesome.com/:_authToken=${FONTAWESOME_NPM_AUTH_TOKEN}" >> ~/.npmrc

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
