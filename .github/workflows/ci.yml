name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The `@fortawesome` scope resolves from FontAwesome's private registry (see
      # `.npmrc`), so the install — not just the Pro packages — needs the token.
      # It is appended to the runner's `~/.npmrc` rather than referenced from the
      # committed one as `${VAR}`: pnpm discards an entire .npmrc it cannot expand,
      # which would take the scope mapping down with it. Repo secret:
      # FONTAWESOME_NPM_AUTH_TOKEN. Note that fork PRs cannot read repo secrets.
      - name: Authenticate to the FontAwesome registry
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: echo "//npm.fontawesome.com/:_authToken=${FONTAWESOME_NPM_AUTH_TOKEN}" >> ~/.npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm lint

      # `convex/_generated/` is committed as the real output of `npx convex dev`, and
      # nothing regenerates it before the checks below (see the note at the top of
      # `packages/convex/scripts/codegen.mjs`). That leaves one way for it to go
      # stale: someone adds or changes a Convex function and does not run
      # `convex dev`. If nothing imports the new function yet, typecheck passes and
      # the drift lands on main. This step provisions a throwaway local backend,
      # pushes the functions to it — which also proves the backend actually compiles
      # and deploys — and fails if what the CLI generates differs from what is
      # committed.
      #
      # CONVEX_AGENT_MODE=anonymous is Convex's documented path for automation: no
      # account, no login, no deploy key. The issuer domain is a placeholder because
      # `auth.config.ts` reads the variable at deploy time, and CI never validates a
      # real Clerk token. Every other `process.env` read in `convex/` is inside a
      # handler, so nothing else needs to be set for the push to succeed.
      - name: Verify the Convex backend deploys and its codegen is current
        env:
          CONVEX_AGENT_MODE: anonymous
        working-directory: packages/convex
        run: |
          pnpm exec convex init
          pnpm exec convex env set CLERK_JWT_ISSUER_DOMAIN https://placeholder.clerk.accounts.dev
          pnpm exec convex dev --once
          git diff --exit-code -- convex/_generated

      - name: Type-check
        run: pnpm check-types

      # The web app's stories run as tests in headless Chromium (Storybook's Vitest addon).
      - name: Install Playwright's Chromium for the story tests
        run: pnpm --filter @skating/web exec playwright install --with-deps chromium-headless-shell

      - name: Test (with coverage)
        run: pnpm test

      # The suite must not care what hour it runs at, and for a while it did. #102 went red at
      # 00:18 UTC on five calendar-label tests that were green on the author's laptop (D243): the
      # labels bucket by *local date*, so a fixture backdated from a live clock falls off "Today"
      # in the first hours after local midnight — and 7 PM–midnight Eastern is 00:00–05:00 UTC,
      # so the author's whole working evening was CI's broken window.
      #
      # `packages/guards/src/testClock.test.ts` is the static half: it stops a new fixture or
      # calendar-asserting test from reading the live clock. This is the dynamic half, and it takes
      # three zones because there are two ways a clock word goes wrong and one zone cannot show
      # both. Note that `Etc/GMT+N` is UTC−N, the sign inverted, so an east-positive offset O maps
      # to `Etc/GMT-O`.
      #
      # 1. **A live clock.** A fixture backdated N hours from `Date.now()` falls off "Today" once
      #    the local hour reads under N:00, which is what reddened #102 at 00:18 UTC. Shown by the
      #    zone computed from the *current UTC hour* so local time is always ~01:00, rather than
      #    hoping CI happens to run in that window.
      # 2. **A pinned instant with a local-date label.** `reportWhen` and `daysBetween` read the
      #    *runner's* date, so a fixture fixed at a UTC instant still names a different weekday
      #    either side of the date line. `Etc/GMT-14` and `Etc/GMT+11` bracket every real zone
      #    (UTC+14 to UTC−11), so a label that only holds near Hanover fails in one of them.
      #
      # Class 2 needs the extremes, not the hour: the 01:00 zone at 05:00 UTC is UTC−3, which
      # shifts no dates at all, and that is exactly how `accessModel.test.ts` passed its own PR and
      # then turned main red at `f5d070a0` nine hours later, when the computed zone was UTC+11.
      #
      # The unit project only: it is the fixture-heavy half and costs under a minute, where the
      # story project needs another Chromium pass. Invoked through vitest rather than `pnpm test`
      # so turbo replays nothing.
      - name: Test the web suite again at 1 AM local, and at both ends of the date line
        run: |
          ONE_AM=$(node -e 'let o=((1-new Date().getUTCHours())%24+24)%24; if (o>12) o-=24; console.log(o>=0?`Etc/GMT-${o}`:`Etc/GMT+${-o}`)')
          for ZONE in "$ONE_AM" Etc/GMT-14 Etc/GMT+11; do
            echo "Re-running the web unit project in $ZONE — local time $(TZ="$ZONE" date +%H:%M)"
            TZ="$ZONE" pnpm --filter @skating/web exec vitest run --project unit
          done

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage
            apps/*/coverage
            scripts/*/coverage
          if-no-files-found: ignore
